appId: com.edekal.whatsapp-marketing
productName: WhatsApp Marketing
copyright: Copyright © EDEKAL-AI
directories:
  output: release
  buildResources: resources
files:
  - out/**/*
  - package.json
# Native modules and the Baileys worker entry cannot be loaded from inside the asar
# archive. Unpack them so utilityProcess.fork() and dlopen() resolve real file paths.
asarUnpack:
  - "**/node_modules/better-sqlite3/**"
  - "out/main/worker.js"
# electron-builder derives platform icon formats from resources/icon.png (1024x1024).
# Regenerate it with: node tools/make-icon.mjs
win:
  target:
    - nsis
  icon: resources/icon.png
  artifactName: ${productName}-${version}-setup.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
mac:
  target:
    - dmg
  category: public.app-category.business
  icon: resources/icon.png
  hardenedRuntime: true
  # Notarization runs via @electron/notarize in an afterSign hook (see CI env below).
linux:
  target:
    - AppImage
    - deb
  icon: resources/icon.png
  category: Office
# Auto-update feed. Replace `url` with where you host release artifacts + latest.yml.
# (GitHub Releases: replace this block with `provider: github` + owner/repo.)
publish:
  provider: generic
  url: https://updates.example.com/whatsapp-marketing
